<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HydraGit</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --hg-ui-font-family: var(--vscode-font-family, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif);
    --hg-ui-font-size: var(--vscode-font-size, 13px);
    --hg-ui-font-weight: var(--vscode-font-weight, 400);

    --hg-editor-font-family: var(--vscode-editor-font-family, var(--hg-ui-font-family));
    --hg-editor-font-size: var(--vscode-editor-font-size, var(--hg-ui-font-size));
    --hg-editor-font-weight: var(--vscode-editor-font-weight, var(--hg-ui-font-weight));

    --hg-ui-font-size-xxs: calc(var(--hg-ui-font-size) - 2px);
    --hg-ui-font-size-xs: calc(var(--hg-ui-font-size) - 1px);
    --hg-ui-font-size-sm: var(--hg-ui-font-size);
    --hg-ui-font-size-md: var(--hg-ui-font-size);
    --hg-ui-font-size-lg: calc(var(--hg-ui-font-size) + 1px);
  }

  body {
    font-family: var(--hg-ui-font-family);
    font-size: var(--hg-ui-font-size);
    font-weight: var(--hg-ui-font-weight);
    background: var(--vscode-sideBar-background, #252526);
    color: var(--vscode-foreground, #cccccc);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    user-select: none;
  }

  /* ── SECTION HEADER ── */
  .section-header {
    display: flex;
    align-items: center;
    padding: 6px 12px 6px 8px;
    gap: 6px;
    font-size: var(--hg-ui-font-size-xs);
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--vscode-sideBarSectionHeader-foreground, #bbbbbe);
    background: var(--vscode-sideBarSectionHeader-background, #252526);
    border-bottom: 1px solid var(--vscode-sideBarSectionHeader-border, transparent);
    flex-shrink: 0;
    cursor: pointer;
    user-select: none;
  }
  .section-header:hover {
    background: var(--vscode-list-hoverBackground, #2a2d2e);
  }
  .section-arrow {
    font-size: var(--hg-ui-font-size-xxs);
    color: var(--vscode-foreground, #cccccc);
    transition: transform 0.15s;
    flex-shrink: 0;
  }
  .section-arrow.collapsed { transform: rotate(-90deg); }
  .section-count {
    margin-left: auto;
    font-size: var(--hg-ui-font-size-xxs);
    font-weight: 400;
    color: var(--vscode-descriptionForeground, #8c8c8c);
    letter-spacing: 0;
    text-transform: none;
  }
  .section-action {
    font-size: var(--hg-ui-font-size-lg);
    color: var(--vscode-descriptionForeground, #8c8c8c);
    cursor: pointer;
    padding: 0 2px;
    border-radius: 3px;
    line-height: 1;
  }
  .section-action:hover {
    color: var(--vscode-foreground, #cccccc);
    background: var(--vscode-toolbar-hoverBackground, #3a3a3a);
  }

  /* ── FILE LIST ── */
  .file-list {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    min-height: 40px;
  }
  .file-list::-webkit-scrollbar { width: 4px; }
  .file-list::-webkit-scrollbar-thumb {
    background: var(--vscode-scrollbarSlider-background, #424242);
    border-radius: 2px;
  }

  .file-row {
    display: flex;
    align-items: center;
    height: 22px;
    padding: 0 8px 0 28px;
    gap: 6px;
    cursor: pointer;
    font-size: var(--hg-ui-font-size-sm);
    color: var(--vscode-foreground, #cccccc);
    white-space: nowrap;
    overflow: hidden;
  }
  .file-row:hover {
    background: var(--vscode-list-hoverBackground, #2a2d2e);
  }
  .file-row.selected {
    background: var(--vscode-list-activeSelectionBackground, #094771);
    color: var(--vscode-list-activeSelectionForeground, #ffffff);
  }

  .file-status {
    font-size: var(--hg-ui-font-size-xxs);
    font-weight: 700;
    width: 14px;
    text-align: center;
    flex-shrink: 0;
    letter-spacing: 0;
  }
  .file-status.M { color: var(--vscode-gitDecoration-modifiedResourceForeground, #e2c08d); }
  .file-status.A { color: var(--vscode-gitDecoration-addedResourceForeground, #81b88b); }
  .file-status.D { color: var(--vscode-gitDecoration-deletedResourceForeground, #c74e39); }
  .file-status.U { color: var(--vscode-gitDecoration-untrackedResourceForeground, #73c991); }
  .file-status.R { color: var(--vscode-gitDecoration-renamedResourceForeground, #73c991); }
  .file-status.C { color: #73c991; }
  .file-status.T { color: #e2c08d; }

  .file-name {
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    font-size: var(--hg-ui-font-size-sm);
  }
  .file-name.M { color: var(--vscode-gitDecoration-modifiedResourceForeground, #e2c08d); }
  .file-name.A { color: var(--vscode-gitDecoration-addedResourceForeground, #81b88b); }
  .file-name.D { color: var(--vscode-gitDecoration-deletedResourceForeground, #c74e39); }
  .file-name.U { color: var(--vscode-gitDecoration-untrackedResourceForeground, #73c991); }
  .file-dir {
    font-size: var(--hg-ui-font-size-xxs);
    color: var(--vscode-descriptionForeground, #8c8c8c);
    overflow: hidden;
    text-overflow: ellipsis;
    flex-shrink: 1;
    min-width: 0;
  }

  /* ── EMPTY STATE ── */
  .empty-state {
    padding: 20px 16px;
    font-size: var(--hg-ui-font-size-sm);
    color: var(--vscode-descriptionForeground, #8c8c8c);
    text-align: center;
    line-height: 1.6;
  }

  /* ── COMMIT AREA ── */
  .commit-area {
    flex-shrink: 0;
    border-top: 1px solid var(--vscode-sideBarSectionHeader-border, #3c3c3c);
    background: var(--vscode-sideBar-background, #252526);
    padding: 8px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .commit-input {
    font-weight: var(--hg-ui-font-weight);
    width: 100%;
    min-height: 52px;
    max-height: 100px;
    background: var(--vscode-input-background, #3c3c3c);
    color: var(--vscode-input-foreground, #cccccc);
    border: 1px solid var(--vscode-input-border, transparent);
    border-radius: 2px;
    font-family: var(--hg-ui-font-family);
    font-size: var(--hg-ui-font-size-sm);
    padding: 6px 8px;
    resize: vertical;
    outline: none;
    line-height: 1.5;
  }
  .commit-input::placeholder {
    color: var(--vscode-input-placeholderForeground, #8c8c8c);
  }
  .commit-input:focus {
    border-color: var(--vscode-focusBorder, #007fd4);
  }

  .btn-row {
    display: flex;
    gap: 6px;
  }

  .btn {
    font-weight: var(--hg-ui-font-weight);
    flex: 1;
    height: 26px;
    border-radius: 2px;
    font-size: var(--hg-ui-font-size-sm);
    font-family: var(--hg-ui-font-family);
    cursor: pointer;
    border: 1px solid transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    white-space: nowrap;
    transition: background 0.1s, opacity 0.1s;
  }
  .btn:disabled {
    opacity: 0.4;
    cursor: default;
  }

  .btn-primary {
    background: var(--vscode-button-background, #0e639c);
    color: var(--vscode-button-foreground, #ffffff);
    border-color: var(--vscode-button-background, #0e639c);
  }
  .btn-primary:hover:not(:disabled) {
    background: var(--vscode-button-hoverBackground, #1177bb);
  }

  .btn-secondary {
    background: var(--vscode-button-secondaryBackground, #3a3d41);
    color: var(--vscode-button-secondaryForeground, #cccccc);
    border-color: var(--vscode-button-secondaryBackground, #3a3d41);
    font-size: var(--hg-ui-font-size-xs);
  }
  .btn-secondary:hover:not(:disabled) {
    background: var(--vscode-button-secondaryHoverBackground, #44474a);
  }

  /* ── STATUS BAR ── */
  .status-bar {
    flex-shrink: 0;
    height: 18px;
    background: var(--vscode-statusBar-background, #007acc);
    color: var(--vscode-statusBar-foreground, #ffffff);
    font-size: var(--hg-ui-font-size-xxs);
    display: flex;
    align-items: center;
    padding: 0 8px;
    gap: 8px;
    overflow: hidden;
  }
  .status-branch {
    font-weight: 500;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .status-msg {
    margin-left: auto;
    opacity: 0.8;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  /* ── LOADING ── */
  .loading {
    padding: 16px;
    font-size: var(--hg-ui-font-size-xs);
    color: var(--vscode-descriptionForeground, #8c8c8c);
    text-align: center;
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }
  .spinner {
    display: inline-block;
    width: 12px; height: 12px;
    border: 1.5px solid var(--vscode-descriptionForeground, #8c8c8c);
    border-top-color: transparent;
    border-radius: 50%;
    animation: spin 0.6s linear infinite;
    vertical-align: middle;
    margin-right: 6px;
  }
</style>
</head>
<body>

<!-- CHANGES SECTION -->
<div class="section-header" onclick="toggleSection()">
  <span class="section-arrow" id="sectionArrow">▾</span>
  <span id="sectionTitle">Changes</span>
  <span class="section-count" id="fileCount"></span>
  <span class="section-action" onclick="refreshChanges(event)" title="Refresh">↺</span>
</div>

<div class="file-list" id="fileList">
  <div class="loading"><span class="spinner"></span>Loading…</div>
</div>

<!-- COMMIT AREA -->
<div class="commit-area">
  <textarea
    class="commit-input"
    id="commitMsg"
    placeholder="Commit message"
    rows="3"
    oninput="updateButtons()"
  ></textarea>
  <div class="btn-row">
    <button class="btn btn-primary" id="btnCommit" onclick="doCommit()" disabled>
      Commit
    </button>
    <button class="btn btn-secondary" id="btnCommitPush" onclick="doCommitPush()" disabled>
      Commit &amp; Push
    </button>
  </div>
</div>

<!-- STATUS BAR -->
<div class="status-bar">
  <span class="status-branch">
    <svg width="11" height="11" viewBox="0 0 11 11" fill="none" style="flex-shrink:0">
      <circle cx="3" cy="2.5" r="1.5" stroke="currentColor" stroke-width="1"/>
      <circle cx="3" cy="8.5" r="1.5" stroke="currentColor" stroke-width="1"/>
      <circle cx="8.5" cy="5.5" r="1.5" stroke="currentColor" stroke-width="1"/>
      <line x1="3" y1="4" x2="3" y2="7" stroke="currentColor" stroke-width="1"/>
      <line x1="4.3" y1="3.2" x2="7.2" y2="4.8" stroke="currentColor" stroke-width="1"/>
    </svg>
    <span id="statusBranch">—</span>
  </span>
  <span class="status-msg" id="statusMsg"></span>
</div>

<script>
// ── IPC BRIDGE ─────────────────────────────────────────
const vscode = acquireVsCodeApi();
const _pending = new Map();

function send(cmd, params = {}) {
  const id = Math.random().toString(36).slice(2, 9);
  return new Promise((res, rej) => {
    _pending.set(id, { resolve: res, reject: rej });
    vscode.postMessage({ id, cmd, params });
  });
}

function applyStatus(status) {
  document.getElementById('statusBranch').textContent = status.branch || '—';

  const files = status.files || [];
  changedFiles = files;
  renderFiles(files);
  updateButtons();
}

window.addEventListener('message', e => {
  const msg = e.data;

  if (msg.type === 'statusUpdate') {
    applyStatus(msg.data || {});
    return;
  }

  const p = _pending.get(msg.id);
  if (!p) return;
  _pending.delete(msg.id);
  msg.ok ? p.resolve(msg.data) : p.reject(new Error(msg.error));
});

// ── STATE ──────────────────────────────────────────────
let changedFiles = [];
let sectionOpen = true;


// ── RENDER FILES ───────────────────────────────────────
function renderFiles(files) {
  const list = document.getElementById('fileList');
  const count = document.getElementById('fileCount');

  if (!files || files.length === 0) {
    count.textContent = '';
    list.innerHTML = '<div class="empty-state">No changes<br><span style="font-size:var(--hg-ui-font-size-xxs)">Working tree clean</span></div>';
    return;
  }

  count.textContent = files.length;

  list.innerHTML = files.map((f, i) => {
    const parts = (f.path || '').split('/');
    const name = parts.pop();
    const dir = parts.join('/');
    const st = (f.status || 'M').toUpperCase();
    return `<div class="file-row" onclick="selectFile(${i})">
      <span class="file-status ${st}">${st}</span>
      <span class="file-name ${st}">${esc(name)}</span>
      ${dir ? `<span class="file-dir">${esc(dir)}</span>` : ''}
    </div>`;
  }).join('');
}

function selectFile(i) {
  // highlight only — diff on click coming later
  document.querySelectorAll('.file-row').forEach((el, idx) => {
    el.classList.toggle('selected', idx === i);
  });
}

// ── SECTION TOGGLE ─────────────────────────────────────
function toggleSection() {
  sectionOpen = !sectionOpen;
  document.getElementById('fileList').style.display = sectionOpen ? '' : 'none';
  document.getElementById('sectionArrow').classList.toggle('collapsed', !sectionOpen);
}

function refreshChanges(e) {
  e.stopPropagation();
  document.getElementById('fileList').innerHTML = '<div class="loading"><span class="spinner"></span>Refreshing…</div>';
  loadChanges();
}

// ── BUTTONS ────────────────────────────────────────────
function updateButtons() {
  const msg = document.getElementById('commitMsg').value.trim();
  const hasFiles = changedFiles.length > 0;
  const canCommit = msg.length > 0 && hasFiles;
  document.getElementById('btnCommit').disabled = !canCommit;
  document.getElementById('btnCommitPush').disabled = !canCommit;
}

function doCommit() {
  const msg = document.getElementById('commitMsg').value.trim();
  if (!msg) return;
  showStatus('Commit — coming soon', '#e2c08d');
  // TODO: send('commit', { message: msg })
}

function doCommitPush() {
  const msg = document.getElementById('commitMsg').value.trim();
  if (!msg) return;
  showStatus('Commit & Push — coming soon', '#e2c08d');
  // TODO: send('commit', { message: msg, push: true })
}

// ── STATUS MESSAGE ─────────────────────────────────────
let statusTimer = null;
function showStatus(msg, color) {
  const el = document.getElementById('statusMsg');
  el.textContent = msg;
  el.style.color = color || '';
  clearTimeout(statusTimer);
  statusTimer = setTimeout(() => { el.textContent = ''; el.style.color = ''; }, 3000);
}

function esc(s) {
  return s ? s.replace(/</g, '&lt;').replace(/>/g, '&gt;') : '';
}

</script>
</body>
</html>
