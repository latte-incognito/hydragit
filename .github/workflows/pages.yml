name: Deploy docs to GitHub Pages

# Publishes the self-contained documentation/ site (index.html + features/* +
# assets/) to GitHub Pages so the per-feature docs actually open in a browser.
# Served at https://latte-incognito.github.io/hydragit/ (the site uses relative
# links, so the Pages root maps 1:1 onto documentation/).
#
# One-time setup: repo Settings → Pages → Build and deployment → Source:
# "GitHub Actions".

on:
  push:
    branches: [develop]
    paths:
      - "documentation/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; newer pushes supersede in-flight ones.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: documentation
      - id: deployment
        uses: actions/deploy-pages@v4
